<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 批改作業重建</title>
<style>
:root{--bg:#0d181d;--panel:#14252c;--panel2:#1a3039;--line:#2f4b55;--paper:#f4efe4;--ink:#1d2a2f;--teal:#3fb8a6;--deep:#183e48;--amber:#e8a64b;--red:#e36b5e;--muted:#8ea6ae;--text:#e9f2f1;--blue:#86aee0;--mono:"Cascadia Mono",Consolas,"Lesson Sans","Noto Sans TC",monospace}
*{box-sizing:border-box}
body{margin:0;background:#081014;color:var(--text);font-family:"Lesson Sans","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select,input{font:inherit}
button,select{background:#152637;color:#f3fafb;border:1px solid #3b566b;border-radius:9px;padding:9px 14px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffcc7f}
#shell{margin:auto;max-width:1400px;padding:20px}
#viewport{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 22px 80px #0007}
#stage{position:relative;transform-origin:top left;overflow:hidden;background:radial-gradient(ellipse at 75% 30%,#173039 0,#0e1b21 55%,#0a1418 100%)}
#stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#9fd8d306 1px,transparent 1px),linear-gradient(90deg,#9fd8d306 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.abs{position:absolute}
#badge{left:72px;top:34px;height:46px;padding:0 20px;border:1px solid #e8a64b88;border-radius:23px;background:#2a2014cc;color:#f4cf95;font-size:22px;display:flex;align-items:center;gap:12px;letter-spacing:1px;z-index:5}
#badge i{width:10px;height:10px;border-radius:5px;background:var(--amber);display:block}
#badge span{color:#c9a46c;font-size:18px}
#clock{right:72px;top:28px;width:600px;height:64px;text-align:right;z-index:5}
#clock b{display:block;font:500 25px var(--mono);color:var(--text)}
#clock small{display:block;font-size:18px;color:var(--muted);margin-top:4px}
#section{left:72px;top:104px;font-size:21px;letter-spacing:4px;color:var(--teal);height:30px;width:900px}
#heading{left:72px;top:134px;width:1400px;height:72px;margin:0;font-size:52px;font-weight:700;line-height:72px;white-space:nowrap}
#heading-en{left:74px;top:206px;width:1400px;height:34px;font-size:24px;color:var(--muted);white-space:nowrap}
#main{left:72px;top:262px;width:1776px;height:528px}
#tl{left:72px;top:800px;width:1776px;height:52px;z-index:4}
#tl .lab{position:absolute;top:0;font-size:17px;color:var(--muted);white-space:nowrap}
#tl .bar{position:absolute;left:0;right:0;top:30px;height:8px;border-radius:4px;background:#22363e}
#tl .range{position:absolute;top:26px;height:16px;border-radius:5px;background:#3fb8a633;border:1px solid #3fb8a6aa}
#tl .tick{position:absolute;top:28px;width:3px;height:12px;border-radius:2px;background:#5f7f88}
#tl .tick.err{background:var(--red);height:18px;top:25px}
#tl .tick.on{background:var(--teal)}
#tl .tick.err.on{background:#ff8b7d;box-shadow:0 0 10px #ff8b7d}
#caption{left:96px;bottom:22px;width:1728px;min-height:96px;z-index:6;border-radius:16px;background:#071014ee;border:1px solid #3fb8a633;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 28px;text-align:center;gap:4px}
#caption1{font-size:41px;line-height:1.28;font-weight:500}
#caption2{font-size:29px;line-height:1.28;color:#b9cfd8}
#credit{left:0;top:0;width:1920px;height:1080px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 45%,#1d3c45 0,#0b1519 70%);z-index:7}
#credit small{font-size:26px;letter-spacing:12px;color:var(--teal)}
#credit strong{font-size:110px;letter-spacing:18px;font-weight:700}
#credit em{font-style:normal;font-size:22px;color:var(--muted);letter-spacing:2px}
/* scene components */
.panel{position:absolute;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.paper{background:var(--paper);color:var(--ink);border:none;box-shadow:0 14px 40px #0006}
.term{position:absolute;border-radius:14px;background:#081014;border:1px solid #284049;font:22px/1.5 var(--mono);color:#cfe3e0;padding:16px 20px;overflow:hidden}
.term .hd{font:600 16px "Lesson Sans",sans-serif;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.term .ln{white-space:pre-wrap;word-break:break-all}
.err{color:var(--red)}.ok{color:var(--teal)}.warn{color:var(--amber)}.dim{color:var(--muted)}.blue{color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:17px;padding:4px 12px;border-radius:14px;white-space:nowrap}
.tag.A{background:#3fb8a62a;color:#8fe3d6;border:1px solid #3fb8a688}
.tag.B{background:#86aee02a;color:#b9d2f2;border:1px solid #86aee088}
.tag.C{background:#e8a64b2a;color:#f4cf95;border:1px solid #e8a64b99}
.tag.R{background:#ffffff14;color:#d8e4e6;border:1px solid #ffffff40}
.doc{position:absolute;background:#fff;box-shadow:0 12px 34px #0008;border-radius:4px;overflow:hidden}
.doc img{width:100%;height:100%;display:block;object-fit:cover;object-position:top}
.h3{font-size:22px;color:var(--muted);letter-spacing:2px}
.big{font-weight:700}
.chip{position:absolute;padding:10px 18px;border-radius:12px;font-size:24px;white-space:nowrap}
.chip.ok{background:#3fb8a622;border:1px solid #3fb8a699;color:#9ff0e3}
.chip.err{background:#e36b5e22;border:1px solid #e36b5e99;color:#ffb3a9}
.chip.warn{background:#e8a64b22;border:1px solid #e8a64baa;color:#f6d39b}
.chip.info{background:#ffffff10;border:1px solid #ffffff38;color:#e5eef0}
.node{position:absolute;border-radius:16px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:24px;line-height:1.3}
.node small{font-size:17px;color:var(--muted)}
.mark{position:absolute;font-size:44px;font-weight:700}
.ecard{position:absolute;width:62px;height:40px;border-radius:7px;font:600 15px var(--mono);display:flex;align-items:center;justify-content:center;color:#0d181d}
.page{position:absolute;border-radius:3px;background:#f1ede4;box-shadow:0 3px 8px #0006}
.pgn{position:absolute;font:600 14px var(--mono);color:#5d6e73;bottom:3px;width:100%;text-align:center}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0}
#seek{flex:1;min-width:170px}#time{font-variant-numeric:tabular-nums;color:#b4cad8}
.interaction{padding:18px;border:1px solid #38586c;border-radius:14px;background:#0d1e2d;display:flex;flex-direction:column;gap:12px}
.interaction p{margin:0}
#quiz-q{font-size:20px}#quiz-meta{font-size:15px;color:#9cb2c2}
.quiz-row{display:flex;gap:10px;flex-wrap:wrap}
#feedback{color:#87e6d3;min-height:1.4em}
.note{font-size:13px;color:#9cb2c2}
body.export #shell{padding:0;max-width:none}body.export #viewport{border-radius:0;box-shadow:none}body.export #controls,body.export .interaction,body.export .note{display:none}
@media (prefers-reduced-motion:reduce){#viewport{scroll-behavior:auto}}
</style>
<div id="shell">
<div id="viewport"><main id="stage" aria-label="影片畫面">
<div id="badge" class="abs" data-qa data-container="#stage"><i></i>依操作日誌重建<span>Reconstructed from the operation log</span></div>
<div id="clock" class="abs" data-qa data-container="#stage"><b id="clock1"></b><small id="clock2"></small></div>
<div id="section" class="abs" data-qa data-container="#stage"></div>
<h1 id="heading" class="abs" data-qa data-container="#stage"></h1>
<div id="heading-en" class="abs" data-qa data-container="#stage"></div>
<div id="main" class="abs"></div>
<div id="tl" class="abs" data-qa data-container="#stage"></div>
<div id="credit" class="abs"><small>感謝觀看</small><strong>李振偉老師</strong><em>依 Codex 操作日誌與交接包重建・Reconstructed from logs and the handoff package</em></div>
<div id="caption" class="abs" data-qa data-container="#stage"><div id="caption1"></div><div id="caption2"></div></div>
</main></div>
<nav id="controls" aria-label="播放控制">
<button id="play">播放</button><button id="replay">重播</button>

<span id="time"></span><select id="locale" aria-label="配音語言"><option value="zh-TW">中文配音（中英字幕）</option></select>
<select id="chapters" aria-label="章節"></select><button id="captions" aria-pressed="true">字幕開啟</button>
</nav>
<section class="interaction" aria-label="互動練習：文法錯誤或風格改善">
<p id="quiz-q"></p><p id="quiz-meta"></p>
<div class="quiz-row"><button id="quiz-g">妨礙理解的文法錯誤</button><button id="quiz-s">可選的風格／精準化改善</button><button id="quiz-next">下一題</button></div>
<p id="feedback" role="status"></p>
</section>
<p class="note">互動題取自 materials/assessment/reviews.json 的實際修改對照，判定以評閱資料的標籤為準。本播放器依操作日誌重建，不是原始桌面錄影。</p>
</div>
<script>
// Every visible state is a pure function of (frame, project). Scenes are rebuilt when the scene id changes.
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
const exporting=params.get('export')==='1';if(exporting)document.body.classList.add('export');
const projectFile=params.get('project')||'project.json';
let project,frame=0,locale='zh-TW',playing=false,captionOn=true,last=0,audio=new Audio(),audioReady=false,built=null,update=()=>{};
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,p)=>a+(b-a)*p;
const out=x=>1-Math.pow(1-clamp(x),3);
const asset=p=>new URL('../'+p,location.href).href;
function el(parent,cls,html='',style={}){const e=document.createElement('div');if(cls)e.className=cls;e.innerHTML=html;Object.assign(e.style,style);parent.appendChild(e);return e}
const UNITLESS=new Set(['lineHeight','opacity','zIndex','fontWeight','flex']);
function px(o){const r={};for(const k in o)r[k]=typeof o[k]==='number'&&!UNITLESS.has(k)?o[k]+'px':o[k];return r}
// Entrances slide in from above/left only (never push past a container's bottom/right edge);
// QA-tracked panels only fade, so their boxes never leave #main or touch the timeline. Hidden = display:none.
function show(e,p,dy=22,dx=0){p=clamp(p);if(e.dataset.qa!==undefined){dy=0;dx=0}if(e._display===undefined)e._display=e.style.display==='none'?'':e.style.display;e.style.opacity=p;e.style.transform=`translate(${-(1-p)*Math.abs(dx)}px,${-(1-p)*Math.abs(dy)}px)`;e.style.display=p<=0.001?'none':e._display}
function qa(e,container='#main',group){e.dataset.qa='';e.dataset.container=container;if(group)e.dataset.overlapGroup=group;if(!e.id)e.id='q'+Math.random().toString(36).slice(2,8);return e}
const fmt=n=>n.toLocaleString('en-US');
function timeLabel(s){const m=Math.floor(s/60),r=s-m*60;return `${m}:${r.toFixed(1).padStart(4,'0')}`}

/* -------- persistent chrome -------- */
function buildTimeline(){const tl=$('tl');tl.innerHTML='';const W=1776,T=project.timeline.total;
 el(tl,'lab','原作業時間軸（非等速呈現）',{left:'0px'});el(tl,'lab','22:04.778',{right:'0px'});
 el(tl,'bar');const range=el(tl,'range');range.id='tl-range';
 for(const c of project.timeline.calls){const t=el(tl,'tick'+(c.error?' err':''),'',{left:(W*c.offset/T-1)+'px'});t.dataset.n=c.n}
 const now=el(tl,'lab','',{left:'0px'});now.id='tl-now';}
function drawChrome(s,t){
 const credit=s.section==='credit';
 for(const id of ['section','heading','heading-en','tl','clock'])$(id).style.display=credit?'none':'block';
 $('credit').style.display=credit?'flex':'none';
 if(credit){const p=ease((t-s.start)/0.8);$('credit').style.opacity=p;return}
 const p=ease((t-s.start)/0.7);
 $('section').textContent=`${s.section_label[0]}  ${s.section_label[1]}  ·  ${String(s.index).padStart(2,'0')} / 13`;
 $('heading').textContent=s.title;$('heading-en').textContent=s.title_en;
 for(const id of ['section','heading','heading-en'])show($(id),p,0,-24);
 if(s.log_offset!=null){$('clock1').textContent=`原作業 2026-10-09 ${s.log_clock}`;$('clock2').textContent=`開始後 +${s.log_offset.toFixed(3)} 秒・本章涵蓋至 +${s.log_end.toFixed(3)} 秒（時間壓縮）`}
 else{$('clock1').textContent='交接整理 2026-10-10';$('clock2').textContent='原作業已於 21:18:27.223 結束（+1,324.778 秒）'}
 const T=project.timeline.total,W=1776,r=$('tl-range'),now=$('tl-now');
 if(s.log_offset!=null){r.style.display='block';r.style.left=W*s.log_offset/T+'px';r.style.width=Math.max(6,W*(s.log_end-s.log_offset)/T)+'px';
  now.style.display='block';now.textContent=`本章 +${timeLabel(s.log_offset)} – +${timeLabel(s.log_end)}`;now.style.left=Math.min(W-420,Math.max(330,W*s.log_offset/T))+'px';now.style.color='#9fe9dc'}
 else{r.style.display='none';now.style.display='block';now.textContent='本章不在原作業時間內';now.style.left='640px';now.style.color='#c9a46c'}
 const tools=new Set(s.tools||[]);for(const k of $('tl').querySelectorAll('.tick'))k.classList.toggle('on',tools.has('T'+String(k.dataset.n).padStart(3,'0')))}

/* -------- scenes -------- */
// ctx.at(i): absolute start time of cue i. Cues before a sample window count as already happened.
function makeCtx(s){const map=new Map(s.cues.map(c=>[c.i,c.start]));const lo=Math.min(...s.cues.map(c=>c.i)),hi=Math.max(...s.cues.map(c=>c.i));
 return{at:i=>map.has(i)?map.get(i):(i<lo?-1e9:1e9),start:s.start,end:s.end}}
const P=(t,a,d=0.6)=>out((t-a)/d);

const SCENES={
s01(m,c){
 const L=qa(el(m,'panel','',px({left:0,top:0,width:820,height:528})));
 L.innerHTML=`<div class="h3" style="position:absolute;left:36px;top:30px">原作業開始・TASK START</div>
 <div style="position:absolute;left:36px;top:70px;font:700 92px var(--mono);letter-spacing:2px">2026-10-09</div>
 <div style="position:absolute;left:40px;top:184px;font:500 36px var(--mono);color:#9fe9dc">20:56:22.451 <span style="font-size:24px;color:var(--muted)">Asia/Taipei</span></div>`;
 const req=el(L,'panel paper','',px({left:36,top:252,width:748,height:244}));
 req.innerHTML=`<div style="padding:22px 26px;font-size:21px;line-height:1.6"><div style="font-size:16px;letter-spacing:2px;color:#5b6d72;margin-bottom:6px">使用者需求（逐字節錄，20:56:23）</div>依照附檔的評分標準，將目錄"中原大學英文作文10份"中的所有作文, 批改作文並評論，將評論建議整理在一份word文件中, 並做成powerpoint簡報 [$ppt-master] , 分析同學的寫作狀況.</div>`;
 const R=qa(el(m,'panel','',px({left:860,top:0,width:916,height:528})));
 el(R,'h3','RUBRIC・三向度各 1–5 分',px({position:'absolute',left:32,top:28}));
 const dims=[['結構與組織','Structure & Organization'],['內容與想法','Content & Ideas'],['文法與表達','Grammar & Expressions']];
 const cols=dims.map((d,i)=>el(R,'node',`${d[0]}<small>${d[1]}</small><b style="font:700 30px var(--mono);margin-top:8px;color:#9fe9dc">1–5</b>`,px({left:32+i*262,top:70,width:240,height:150})));
 const sum=el(R,'',`<span style="font:700 46px var(--mono);color:var(--amber)">＝ 15 分</span>`,px({position:'absolute',left:32,top:236}));
 const grid=el(R,'',``,px({position:'absolute',left:32,top:308,width:850,height:120}));
 const docs=[];for(let i=0;i<10;i++){docs.push(el(grid,'',`<div style="font:700 22px var(--mono);color:#0d181d">${String(i+1).padStart(2,'0')}</div><div style="font-size:13px;color:#4c5b60">.docx</div>`,px({position:'absolute',left:i*85,top:0,width:72,height:96,background:'#f1ede4',borderRadius:6,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'})))}
 const note=el(R,'',`十篇・正文各 4 段・248–257 英文字`,px({position:'absolute',left:32,top:440,fontSize:22,color:'#cfe3e0'}));
 const note2=el(R,'chip info',`畫面時間＝原作業開始後秒數（+s）`,px({left:430,top:432}));
 return t=>{show(L,P(t,c.start,0.8));show(req,P(t,c.at(2)));show(R,P(t,c.at(3)));
  cols.forEach((e,i)=>show(e,P(t,c.at(4)+i*0.25),30));show(sum,P(t,c.at(5)),0,-20);
  docs.forEach((e,i)=>show(e,P(t,c.at(6)+i*0.08,0.4),40));show(note,P(t,c.at(6)+0.9));show(note2,P(t,c.at(7)))}
},
s02(m,c){
 const D=qa(el(m,'panel','',px({left:0,top:0,width:1776,height:250})));
 const n0=el(D,'node','讀取技能說明<small>SKILL.md</small>',px({left:30,top:70,width:230,height:110}));
 const n1=el(D,'node','Windows 沙箱<small>exec_command</small>',px({left:400,top:22,width:260,height:92}));
 const n2=el(D,'node','Node REPL<small>同樣依賴沙箱</small>',px({left:400,top:136,width:260,height:92}));
 const n3=el(D,'node','升權執行<small>require_escalated</small>',px({left:860,top:70,width:260,height:110}));
 const n4=el(D,'node','ppt-master 入口<small>版本 6.7.0</small>',px({left:1300,top:70,width:260,height:110}));
 const x1=el(D,'mark err','✕',px({left:680,top:34})),x2=el(D,'mark err','✕',px({left:680,top:148})),ok=el(D,'mark ok','✓',px({left:1580,top:90}));
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','1776');svg.setAttribute('height','250');Object.assign(svg.style,{position:'absolute',left:'0',top:'0',pointerEvents:'none'});
 svg.innerHTML=`<path id="a1" d="M260 115 L400 68" stroke="#e36b5e" stroke-width="3" fill="none" stroke-dasharray="8 7"/><path id="a2" d="M260 135 L400 182" stroke="#e36b5e" stroke-width="3" fill="none" stroke-dasharray="8 7"/><path id="a3" d="M260 125 L860 125" stroke="#3fb8a6" stroke-width="4" fill="none"/><path id="a4" d="M1120 125 L1300 125" stroke="#3fb8a6" stroke-width="4" fill="none"/>`;D.prepend(svg);
 const a3=svg.querySelector('#a3'),a4=svg.querySelector('#a4'),L3=a3.getTotalLength?1:1;
 const T=qa(el(m,'term','',px({left:0,top:272,width:1180,height:256})));
 T.innerHTML=`<div class="hd">原始工具輸出節錄（已截短）・RAW TOOL OUTPUT EXCERPT</div>`;
 const lines=[['<span class="dim">+8.204s  T001</span> <span class="err">exec_command failed: … helper_unknown_error: setup refresh had errors</span>'],
  ['<span class="dim">+23.226s T004</span> <span class="err">node_repl … windows sandbox failed: helper_unknown_error</span>'],
  ['<span class="dim">+29.089s T005</span> <span class="ok">以 require_escalated 讀取 ppt-master 入口（6.7.0）</span>'],
  ['<span class="dim">+48.748s T006</span> documents 技能・資料夾清單・套件環境']].map(l=>el(T,'ln',l[0]));
 const note=qa(el(m,'panel','',px({left:1210,top:272,width:566,height:256})));
 note.innerHTML=`<div style="padding:28px;font-size:27px;line-height:1.55"><span class="warn big">沙箱沒有被修好</span><br>工作改走一條<span class="ok">獲准的執行路徑</span>。<div style="font-size:19px;color:var(--muted);margin-top:14px">之後的命令皆以 require_escalated 執行（06 E01）</div></div>`;
 return t=>{show(D,P(t,c.start,0.8));show(n0,1);show(n1,P(t,c.at(1)-0.3));show(n2,P(t,c.at(2)-0.3));
  show(x1,P(t,c.at(1)+0.4,0.3),0);show(x2,P(t,c.at(2)+0.4,0.3),0);

  const k=P(t,c.at(5),0.8);show(take,k,20);ppt.style.opacity=Math.min(ppt.style.opacity,1-k);rep.style.opacity=Math.min(rep.style.opacity,1-k)}
}};

function buildScene(s){const m=$('main');m.innerHTML='';built=s.id;update=()=>{};if(s.section==='credit')return;update=SCENES[s.id](m,makeCtx(s))}
function currentScene(t){return project.variants[locale].scenes.find(s=>t>=s.start&&t<s.end)||project.variants[locale].scenes.at(-1)}
function draw(){const t=frame/project.fps,s=currentScene(t);if(built!==s.id)buildScene(s);drawChrome(s,t);update(t);
 const cue=project.variants[locale].subtitles.cues.find(c=>t>=c.start&&t<c.end);const credit=s.section==='credit';
 $('caption').style.display=cue&&captionOn&&!credit?'flex':'none';$('caption1').textContent=cue?.text[0]||'';$('caption2').textContent=cue?.text[1]||'';
 $('seek').value=frame;$('time').textContent=t.toFixed(1)+' / '+project.duration.toFixed(1)+' s';$('chapters').value=s.start}

/* -------- player plumbing (API shared with the skill renderer) -------- */
function scale(){if(!project)return;const s=exporting?1:Math.min(1,$('shell').clientWidth/project.width);$('stage').style.transform='scale('+s+')';$('viewport').style.width=project.width*s+'px';$('viewport').style.height=project.height*s+'px'}
function setAudio(){audio.pause();const mix=project.variants[locale].mix;audioReady=!!mix;if(mix)audio.src=asset(mix);else audio.removeAttribute('src');audio.load()}
function chapters(){const select=$('chapters');select.replaceChildren();for(const s of project.variants[locale].scenes){const o=document.createElement('option');o.value=s.start;o.textContent=s.section==='credit'?'片尾':`${String(s.index).padStart(2,'0')} ${s.title}`;select.append(o)}}
async function loadFonts(){for(const a of project.font_assets||[]){const face=new FontFace(a.family,'url('+JSON.stringify(asset(a.url))+')');try{document.fonts.add(await face.load())}catch{throw Error('Required font could not load: '+a.family)}}await document.fonts.ready}
async function seekToFrame(n,language=locale){if(!project.variants[language])throw Error('Unknown locale');frame=Math.max(0,Math.min(Math.round(project.duration*project.fps)-1,Math.round(n)));draw();if(!exporting&&audioReady&&Math.abs(audio.currentTime-frame/project.fps)>.15)audio.currentTime=frame/project.fps;return frame}
function pause(){playing=false;audio.pause();$('play').textContent='播放'}
async function play(){if(frame>=project.duration*project.fps-1)await seekToFrame(0);playing=true;last=performance.now();$('play').textContent='暫停';if(audioReady){audio.currentTime=frame/project.fps;try{await audio.play()}catch{pause();$('feedback').textContent='音軌無法播放，請以本機伺服器開啟並允許播放音訊。';return}}requestAnimationFrame(tick)}
function tick(now){if(!playing)return;const next=audioReady?Math.floor(audio.currentTime*project.fps):frame+(now-last)*project.fps/1000;last=now;if(next>=project.duration*project.fps){seekToFrame(project.duration*project.fps-1);pause();return}frame=next;draw();requestAnimationFrame(tick)}
audio.addEventListener('ended',()=>{if(playing){seekToFrame(project.duration*project.fps-1);pause()}});
window.lesson={ready:async()=>{await loaded;await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})))},seekToFrame,bounds:()=>[],getProject:()=>project};

/* -------- learning interaction: grammar error or optional style improvement? -------- */
let quiz=0;
function quizShow(){const e=window.EDITS[quiz];$('quiz-q').innerHTML=`第 ${quiz+1}／${window.EDITS.length} 題：<b>${e.orig}</b> → <b>${e.rev}</b>`;$('quiz-meta').textContent=`作文 ${e.id}・${e.p}`;$('feedback').textContent=''}
function quizAnswer(grammar){const e=window.EDITS[quiz];const right=!grammar;$('feedback').textContent=(right?'答對了。':'再想想。')+`評閱標為「${e.kind}」：${e.why}`}
// Retry transient network failures (e.g. connection resets right after a static-host deploy).
async function getJSON(url){let last;for(let i=0;i<4;i++){try{const r=await fetch(url);if(r.ok)return await r.json();last=Error('HTTP '+r.status)}catch(e){last=e}await new Promise(r=>setTimeout(r,400*(i+1)))}throw Error('Cannot load '+url+': '+last.message)}
const loaded=(async()=>{project=await getJSON(asset(projectFile));
 window.EDITS=await getJSON(asset('player/edits.json'));
 await loadFonts();$('stage').style.width=project.width+'px';$('stage').style.height=project.height+'px';$('seek').max=Math.round(project.duration*project.fps)-1;
 buildTimeline();chapters();setAudio();scale();quizShow();await seekToFrame(0)})();
$('play').onclick=()=>playing?pause():play();$('replay').onclick=async()=>{pause();await seekToFrame(0);await play()};
$('seek').oninput=()=>{pause();seekToFrame(Number($('seek').value))};$('chapters').onchange=()=>{pause();seekToFrame(Number($('chapters').value)*project.fps)};
$('captions').onclick=()=>{captionOn=!captionOn;$('captions').textContent=captionOn?'字幕開啟':'字幕關閉';$('captions').setAttribute('aria-pressed',String(captionOn));draw()};
$('quiz-g').onclick=()=>quizAnswer(true);$('quiz-s').onclick=()=>quizAnswer(false);$('quiz-next').onclick=()=>{quiz=(quiz+1)%window.EDITS.length;quizShow()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}});
window.addEventListener('resize',scale);
</script>
